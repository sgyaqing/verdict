<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 200 64" width="200" height="64" role="img" aria-label="Verdict">
  <title>Verdict</title>
  <!-- Mark: nine requests in one batch, mixed as they arrive (no row and no column
       is a single kind). One violet in three tints: calm over separation. -->
  <g transform="translate(-7.2 3.2) scale(0.9)">
    <rect x="8" y="8" width="14" height="14" rx="4.5" fill="#7C5CFF"/>
    <rect x="25" y="8" width="14" height="14" rx="4.5" fill="#A78BFA"/>
    <rect x="42" y="8" width="14" height="14" rx="4.5" fill="#DDD6FE"/>
    <rect x="8" y="25" width="14" height="14" rx="4.5" fill="#A78BFA"/>
    <rect x="25" y="25" width="14" height="14" rx="4.5" fill="#DDD6FE"/>
    <rect x="42" y="25" width="14" height="14" rx="4.5" fill="#7C5CFF"/>
    <rect x="8" y="42" width="14" height="14" rx="4.5" fill="#DDD6FE"/>
    <rect x="25" y="42" width="14" height="14" rx="4.5" fill="#7C5CFF"/>
    <rect x="42" y="42" width="14" height="14" rx="4.5" fill="#A78BFA"/>
  </g>
  <text x="60" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="600" letter-spacing="-1.2" fill="#0B0C0F">Verdict</text>
</svg>
